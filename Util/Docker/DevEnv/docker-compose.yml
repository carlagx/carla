# CARLA development environment. Start: ./manage.sh up   (see docs/OFFLINE_DOCKER.md)
services:
  carla-dev:
    image: carla-dev:latest
    build:
      context: .
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    container_name: carla-dev
    ports:
      - "${CODE_PORT:-8080}:8080"       # web VS Code
      - "${ARTIFACT_PORT:-8081}:8081"   # artifact downloads
      - "2000-2002:2000-2002"           # CARLA RPC, for a server started here
    volumes:
      - ${CARLA_SRC:-../../..}:/workspace/carla
      - ${UE4_ROOT_HOST:-~/UnrealEngine_4.26}:/opt/UnrealEngine_4.26
      - ${CREDENTIALS_DIR:-./credentials}:/run/credentials:ro
      - ${ARTIFACTS_DIR:-./artifacts}:/artifacts
      - ${OFFLINE_CACHE_DIR:-./offline-cache}:/opt/offline-cache
      - home:/home/carla
    ulimits:
      nofile: 65536
    shm_size: 2g
    restart: unless-stopped
volumes:
  home:
