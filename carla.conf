# CARLA start configuration, read by carla-start.sh.
# Plain bash syntax: KEY=value, no spaces around '='. Quote values with spaces.
# Command line flags of carla-start.sh override these values.

# ---- Which client API to start: python | cpp -------------------------------
API=python

# ---- Server ----------------------------------------------------------------
# Folder that contains CarlaUE4.sh (the server package).
# The client API must be the same version as this server (0.9.16 here).
CARLA_ROOT=/home/carlagx/carla0916

# Map loaded at server start, e.g. /Game/Carla/Maps/Town06. Empty = server default.
CARLA_MAP=/Game/Carla/Maps/Town06

# RPC port of the server. Client connects to CARLA_HOST:CARLA_PORT.
CARLA_HOST=127.0.0.1
CARLA_PORT=2000

# Start a new server: auto = start only if nothing listens on CARLA_PORT | yes | no
START_SERVER=auto

# Extra Unreal arguments for the server, e.g. "-RenderOffScreen -quality-level=Low -nosound"
CARLA_SERVER_ARGS=""

# Seconds to wait for the server port before giving up
SERVER_TIMEOUT=60

# ---- Python API ------------------------------------------------------------
# Client wheel matching CARLA_ROOT. It is unpacked once into PY_CARLA_DIR.
PY_WHEEL=/home/carlagx/carla0916/PythonAPI/carla/dist/carla-0.9.16-cp310-cp310-manylinux_2_31_x86_64.whl
PY_CARLA_DIR=$HOME/.cache/carla-0.9.16-py310
PY_INTERPRETER=python3

# Script to run. manual_control.py = keyboard driving (WASD / arrows, H = help)
PY_SCRIPT=/home/carlagx/carla0916/PythonAPI/examples/manual_control.py

# Extra arguments for PY_SCRIPT, e.g. "--res 1280x720 --sync"
PY_ARGS=""

# Default vehicle blueprint for the Python client (manual_control spawns it as "hero").
# Examples: vehicle.audi.a2, vehicle.tesla.model3. Empty = random vehicle.
VEHICLE=vehicle.audi.a2

# ---- C++ API ---------------------------------------------------------------
# Built client binary. Build it with: make -C /home/carlagx/carla-xil/carla/Examples/CppClient
# It must be built against the same CARLA version as the server.
CPP_CLIENT_BIN=/home/carlagx/carla-xil/carla/Examples/CppClient/bin/cpp_client

# Arguments for the binary: [host port drive_distance]. Empty = host/port from above.
CPP_ARGS=""
