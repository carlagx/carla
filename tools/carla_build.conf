# ============================================================================
#  CARLA 0.9.16 Build-Konfiguration für Ubuntu 22.04 LTS
#  Wird von build_carla.sh per 'source' eingelesen.
#  Anpassungen hier vornehmen, ohne das Hauptscript zu ändern.
# ============================================================================

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🔗 Repository-Einstellungen
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Git-URL: Kann auf ein Fork zeigen (z.B. mit lokalen Fixes)
REPO_URL="https://github.com/carla-simulator/carla.git"

# Quell-Branch (Standard: ue4-dev für neuesten Stand)
SOURCE_BRANCH="ue4-dev"

# Neuer lokaler Branch (wird erstellt/ausgecheckt)
# Sinnvoll für lokale Modifikationen
NEW_BRANCH="ue4-ubuntu22"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 📁 Zielverzeichnis
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Basis-Ordner zum Klonen
CLONE_BASE_DIR="/home/carlagx/repos"

# Name des CARLA-Ordners
CLONE_DIR_NAME="carla"

# Verhalten, falls Zielverzeichnis existiert:
#   reuse = bestehendes Repo weiterverwenden (Git-Fetch & Branch)
#   fail  = mit Fehler abbrechen
ON_EXISTING_DIR="reuse"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🚀 Unreal Engine 4.26
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Muss bereits gebaut/installiert sein!
UE4_ROOT="/home/carlagx/UnrealEngine_4.26"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🐍 Python-Einstellungen
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Python 3.10+ empfohlen
PYTHON_BIN="python3"

# Zusatzflags für 'pip install'
PIP_ARGS="--upgrade"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 📦 Content/Assets (Update.sh)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Content herunterladen? (true = ja, ~20 GB)
# ACHTUNG: Nur einmal pro Repo notwendig
RUN_UPDATE=true

# Nur Verzeichnisstruktur erstellen, nicht herunterladen
# true  = schnell
# false = standard (lädt ~20 GB herunter)
UPDATE_SKIP_DOWNLOAD=false

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 📚 System-Abhängigkeiten (apt)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# System-Pakete installieren? (benötigt sudo)
# Default: false (Umgebung existiert üblicherweise bereits)
INSTALL_APT_DEPS=false

# Liste der apt-Pakete (wenn INSTALL_APT_DEPS=true)
APT_PACKAGES="build-essential g++-12 cmake ninja-build libvulkan1 python3 python3-dev python3-pip python3-venv autoconf wget curl rsync unzip git git-lfs libpng-dev libtiff5-dev libjpeg-dev aria2"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🔧 Python Build-Requirements
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Python Build-Requirements installieren (pip)
# (z.B. pygame, numpy für die PythonAPI)
INSTALL_PYTHON_DEPS=true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🔨 Build-Pipeline
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# make-Targets in Reihenfolge. Targets entfernen zum Überspringen:
#   PythonAPI  = Python-Wheel + C++-Bindings
#   launch     = CarlaUE4.sh Binary
#   package    = Verteilbares Paket unter Dist/
BUILD_STEPS=("PythonAPI" "launch" "package")

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 📝 Logging & Diagnostik
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Ordner für Schritt-Logdateien
LOG_DIR="/home/carlagx/repos/carla_build_logs"

# ============================================================================
# 🚀 BEISPIEL-NUTZUNG:
# ============================================================================
#
#   # Nur Preflight-Checks (keine Änderungen)
#   ./build_carla.sh --preflight-only
#
#   # Normaler Build mit dieser Config
#   ./build_carla.sh
#
#   # Custom Config verwenden
#   ./build_carla.sh --config ~/my_carla.conf
#
#   # Xerces-Fix überspringen
#   ./build_carla.sh --skip-xerces
#
# ============================================================================
